name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev \
            cmake clang libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The protocol layer must stay usable with no IO and no transport.
      - run: cargo build -p dgnative --no-default-features

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            gui: true
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            gui: true
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            gui: true
          # gpui supports macOS and Linux only, so Windows ships the CLI alone.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            gui: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev \
            cmake clang libasound2-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libssl-dev

      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }} -p dgnative-cli
      - name: Build GUI
        if: matrix.gui
        run: cargo build --release --locked --target ${{ matrix.target }} -p dgnative-gui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          stage="dgnative-${{ matrix.name }}"
          mkdir -p "dist/$stage"
          bin="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin/dgnative.exe" "dist/$stage/"
          else
            cp "$bin/dgnative" "dist/$stage/"
            if [ "${{ matrix.gui }}" = "true" ]; then
              cp "$bin/dgnative-gui" "dist/$stage/"
            fi
          fi
          cp README.md "dist/$stage/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$stage.zip" "$stage" >/dev/null
          else
            tar czf "$stage.tar.gz" "$stage"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dgnative-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish
    needs: [check, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Every commit on main refreshes one rolling prerelease.
      - name: Publish rolling build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete rolling --cleanup-tag --yes || true
          gh release create rolling dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "rolling build ${GITHUB_SHA:0:8}" \
            --notes "Built from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%dT%H:%MZ).

          Unsigned binaries. macOS will refuse them until you clear the quarantine flag:
          \`xattr -d com.apple.quarantine dgnative dgnative-gui\`."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
