[package]
name = "dgnative-cli"
description = "Command-line control tool for the DG-LAB Coyote V3 pulse host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dgnative"
path = "src/main.rs"

[dependencies]
dgnative = { workspace = true, features = ["ble"] }

anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures.workspace = true
ipnet = "2.12.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
    "sync",
    "net",
] }
